name = "uptimeflare_worker"
main = "src/index.ts"
compatibility_date = "2026-11-14"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

[[d1_databases]]
binding = "UPTIMEFLARE_DB"
database_name = "uptimeflare_state"
# Resolved by scripts/set-wrangler-d1-id.mjs from the authenticated D1 listing.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[triggers]
crons = ["* * * * *"]

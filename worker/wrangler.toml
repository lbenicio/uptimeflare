name = "uptimeflare_worker"
main = "src/index.ts"
compatibility_date = "2026-11-14"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

[[d1_databases]]
binding = "UPTIMEFLARE_DB"
database_name = "uptimeflare_state"
# Injected from UPTIMEFLARE_D1_DATABASE_ID during the Cloudflare build.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[triggers]
crons = ["* * * * *"]
